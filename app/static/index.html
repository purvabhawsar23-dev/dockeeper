<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocKeeper</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────────────── -->
  <header class="app-header">
    <span class="logo">📄 DocKeeper</span>
    <span class="tagline">Your personal document assistant</span>
  </header>

  <!-- ── Main layout: left panel + right panel ──────────────────────── -->
  <main class="layout">

    <!-- Left panel: upload + document list -->
    <section class="panel panel-left" aria-label="Documents">

      <!-- Upload area -->
      <div class="upload-box" id="uploadBox" role="region" aria-label="Upload area">
        <div class="upload-icon" aria-hidden="true">⬆️</div>
        <p class="upload-hint">Drag &amp; drop files here, or</p>
        <!-- File picker — hidden; triggered by the button below -->
        <input type="file" id="fileInput" multiple
               accept=".pdf,.docx,.xlsx,.txt,.md,.png,.jpg,.jpeg,.webp"
               aria-label="Choose files" />
        <button class="btn btn-secondary" id="browseBtn">Browse files</button>
        <p class="upload-hint upload-hint-small">PDF, DOCX, XLSX, TXT, MD (max 200 MB) · PNG, JPG, WEBP (max 10 MB)</p>
      </div>

      <!-- Per-file upload progress messages -->
      <div id="uploadStatus" aria-live="polite"></div>

      <!-- Document list -->
      <h2 class="panel-heading">Your Documents</h2>
      <div id="docList" aria-label="Document list">
        <p class="empty-hint">No documents yet.</p>
      </div>

    </section>

    <!-- Right panel: chat -->
    <section class="panel panel-right" aria-label="Chat">

      <div class="chat-header-bar">
        <h2 class="panel-heading">Ask a question</h2>
        <!-- Checkbox to read incoming answers aloud automatically -->
        <label class="auto-speak-toggle" for="autoSpeakCheckbox">
          <input type="checkbox" id="autoSpeakCheckbox" />
          <span>Read answers aloud automatically</span>
        </label>
      </div>

      <!-- Message history -->
      <div id="chatMessages" class="chat-messages" role="log" aria-live="polite"></div>

      <!-- Voice notification/status message banner (for errors, permissions, voice alerts) -->
      <div id="voiceStatus" class="voice-status" aria-live="polite"></div>

      <!-- Input row with textarea, language selector, mic button, and send button -->
      <div class="chat-input-row">
        <textarea id="chatInput" class="chat-textarea" rows="2"
                  placeholder="Ask anything about your documents… (Enter to send, Shift+Enter for new line)"
                  aria-label="Your question"></textarea>
        <!-- Language selector for speech recognition: en-IN and hi-IN -->
        <select id="voiceLangSelect" class="voice-lang-select" aria-label="Speech recognition language" title="Speech recognition language">
          <option value="en-IN">English (India)</option>
          <option value="hi-IN">Hindi</option>
        </select>
        <!-- Microphone button for voice input -->
        <button class="btn btn-icon btn-mic" id="micBtn" type="button"
                aria-label="Voice input" title="Voice input">🎤</button>
        <button class="btn btn-primary" id="sendBtn" aria-label="Send question">Send</button>
      </div>

    </section>

  </main>

  <script src="/static/app.js"></script>
</body>
</html>
